; Attendance terminal, Option B (docs/hardware-specs.md section 5): ESP32 +
; GROW R503 fingerprint + GM65 barcode/QR scanner + SSD1306 OLED + buzzer.
; Talks to the backend as a paired terminal (backend docs/terminals.md).

[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@2.1.3
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17
build_flags = -DCORE_DEBUG_LEVEL=1

; The pure logic in lib/core, tested on this computer: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
