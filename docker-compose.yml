name: attendance_backend   # same project name => reuses the existing Postgres container and volume
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  # Turns face photos into embeddings for face check-in (docs/face-recognition.md).
  # Called by the API only; bound to localhost like the database.
  face-service:
    build: ./face-service
    restart: unless-stopped
    environment:
      FACE_SERVICE_KEY: ${FACE_SERVICE_KEY}
    ports:
      - "127.0.0.1:8001:8000"
volumes:
  attendance_pgdata:
